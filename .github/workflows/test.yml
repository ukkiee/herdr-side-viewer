name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # macOS: the router tests run `sh` and stand in a fake `defaults`, as on the machines that use the mod.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # `herdr-app check mods/side-viewer` is left out: it needs the Herdr app installed.
      - run: node --test mods/side-viewer/
